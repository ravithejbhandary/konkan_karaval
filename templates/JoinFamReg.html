<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Header.css') }}"> <!-- Custom CSS -->
</head>
<body>
    <my-header></my-header>
    
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="form-container w-100 p-4 bg-white rounded shadow-lg">
            <div class="text-box text-center">
                <h2>Join Our Family</h2>
            </div>
            <form id="registerForm" class="row g-3" method="POST" action="{{ url_for('register') }}">
                
                <div class="col-12">
                    <label for="name" class="form-label">Name: <span class="mandatory">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>

                <div class="col-12">
                    <label for="email" class="form-label">Email Address: <span class="mandatory">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="col-12">
                    <label for="password" class="form-label">Create Password: <span class="mandatory">*</span></label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <div class="col-12">
                    <label for="city" class="form-label">Nearest Capital City:</label>
                    <select id="city" name="city" class="form-select" required>
                        <option value="" disabled selected>Select a city</option>
                        <option>Adelaide</option>
                        <option>Brisbane</option>
                        <option>Canberra</option>
                        <option>Darwin</option>
                        <option>Perth</option>
                        <option>Melbourne</option>
                        <option>Sydney</option>
                        <option>Hobart</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="phone" class="form-label">Phone Number: <span class="mandatory">*</span></label>
                    <input type="text" class="form-control" id="phone" name="phone" required>
                </div>

                <div class="col-12">
                    <label for="family_details" class="form-label">Enter details about your family:</label>
                    <textarea id="family_details" name="family_details" class="form-control" rows="3"></textarea>
                </div>

                <div class="col-12">
                    <label for="children_count" class="form-label">Number of children (under 18) in your family:</label>
                    <input type="number" class="form-control" id="children_count" name="children_count">
                </div>

                <div class="col-12">
                    <label for="interests" class="form-label">Interests your family wishes to participate in:</label>
                    <textarea id="interests" name="interests" class="form-control" rows="3"></textarea>
                </div>

                <div class="col-12 text-center">
                    <button type="submit" class="btn w-100 fw-bold">Register</button>
                </div>

                <div class="col-12 text-center">
                    <p>Already a member? <a href="{{ url_for('login') }}" class="text-primary">Login here</a></p>
                </div>
                
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
